services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: multiverse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: multiverse
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U multiverse -d multiverse']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
