name: Multiverse

options:
  developmentLanguage: pt-BR
  bundleIdPrefix: com.nexussoft.multiverse
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    exactVersion: 2.17.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.9.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    exactVersion: 9.2.0

fileGroups:
  - Configuration

configFiles:
  Debug: Configuration/Staging.xcconfig
  Release: Configuration/Production.xcconfig

settings:
  base:
    DEVELOPMENT_TEAM: 5RS2AA677K
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # L10n owns the bilingual catalog; prevent Xcode extracting display-only tokens.
    SWIFT_EMIT_LOC_STRINGS: NO
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_PREVIEWS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Multiverse:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Multiverse
        excludes:
          - "**/*.md"
    settings:
      configs:
        Debug:
          # Personal Team: paid capabilities belong only to Release signing.
          CODE_SIGN_ENTITLEMENTS: Configuration/Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Multiverse/Resources/Multiverse.entitlements
      base:
        MULTIVERSE_PUSH_ENABLED: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(MULTIVERSE_BUNDLE_ID)"
        INFOPLIST_FILE: Multiverse/Resources/Info.plist
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: LiveKit
        product: LiveKit
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseAnalyticsCore
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseCore
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: MultiverseWidgets
        embed: true
    postBuildScripts:
      - name: Validate and copy Firebase environment
        script: /usr/bin/python3 "$SRCROOT/scripts/configure_environment.py"
        inputFiles:
          - "$(SRCROOT)/scripts/configure_environment.py"
          - "$(SRCROOT)/$(MULTIVERSE_FIREBASE_PLIST)"
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist"
        basedOnDependencyAnalysis: false
    scheme:
      storeKitConfiguration: Configuration/Products.storekit
      testTargets:
        - MultiverseTests

  MultiverseTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MultiverseTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Multiverse

  # Widgets (2a) + Live Activity de estreia (2b). Precisa de App Group real no Xcode —
  # ver "Setup no Mac" no README antes do primeiro build.
  MultiverseWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MultiverseWidgets
      - path: Multiverse/Resources/Fonts
        excludes:
          - "**/*.md"
        buildPhase: resources
      - path: Multiverse/DesignSystem/Theme.swift
      - path: Multiverse/DesignSystem/Components.swift
      - path: Multiverse/DesignSystem/ProfileAvatar.swift
      - path: Multiverse/DesignSystem/AvatarPhotoImages.swift
      - path: Multiverse/Core/ProfileAvatarChoice.swift
      - path: Multiverse/DesignSystem/CatalogCoverOverlay.swift
      - path: Multiverse/Core/API/CatalogCover.swift
      - path: Multiverse/Core/Models.swift
      - path: Multiverse/Core/Logic.swift
      - path: Multiverse/Core/Localization
      - path: Multiverse/Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Multiverse/Core/Configuration/AppEnvironment.swift
      - path: Multiverse/Core/Store/WidgetBridge.swift
      - path: Multiverse/Core/Store/PremiereActivityAttributes.swift
    settings:
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Configuration/Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: MultiverseWidgets/MultiverseWidgets.entitlements
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(MULTIVERSE_BUNDLE_ID).widgets"
        INFOPLIST_FILE: MultiverseWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
