name: Multiverse

options:
  bundleIdPrefix: com.multiverse
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_PREVIEWS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Multiverse:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Multiverse
        excludes:
          - "**/*.md"
    info:
      path: Multiverse/Resources/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - "Archivo-VariableFont_wdth,wght.ttf"
    entitlements:
      path: Multiverse/Resources/Multiverse.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.multiverse.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.multiverse.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: MultiverseWidgets
        embed: true
    scheme:
      testTargets:
        - MultiverseTests

  MultiverseTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MultiverseTests
    dependencies:
      - target: Multiverse

  # Widgets (2a) + Live Activity de estreia (2b). Precisa de App Group real no Xcode —
  # ver "Setup no Mac" no README antes do primeiro build.
  MultiverseWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MultiverseWidgets
      - path: Multiverse/DesignSystem/Theme.swift
      - path: Multiverse/DesignSystem/Components.swift
      - path: Multiverse/Core/Models.swift
      - path: Multiverse/Core/Logic.swift
      - path: Multiverse/Core/Store/WidgetBridge.swift
      - path: Multiverse/Core/Store/PremiereActivityAttributes.swift
    info:
      path: MultiverseWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MultiverseWidgets/MultiverseWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.multiverse.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.multiverse.app.widgets
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
