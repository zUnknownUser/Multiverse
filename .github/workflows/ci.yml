name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  localization:
    name: Translations and deployment configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: make localization-check environment-check

  api:
    name: API (PostgreSQL 18)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: multiverse_test
          POSTGRES_PASSWORD: multiverse_test_only
          POSTGRES_DB: multiverse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multiverse_test -d multiverse_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://multiverse_test:multiverse_test_only@127.0.0.1:5432/multiverse_test
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: backend/api/.nvmrc
          cache: npm
          cache-dependency-path: backend/api/package-lock.json
      - run: npm ci
      - run: npm run check

  firebase:
    name: Firebase Functions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/firebase/functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/firebase/functions/package-lock.json
      - run: npm ci
      - run: npm test

  ios:
    name: iOS Simulator
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and test
        run: >-
          make ios-test
          IOS_DESTINATION='platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5'
          IOS_TEST_OPTIONS='-parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO MULTIVERSE_API_BASE_URL=http://127.0.0.1:1/api/v1'
